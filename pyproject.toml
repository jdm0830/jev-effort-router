[project]
name = "hermes-plugin-jev-effort-router"
version = "0.2.2"
description = "Hermes plugin — route each user turn to an OpenRouter model and reasoning effort via TypeSafe Jev."
keywords = ["hermes", "plugin", "routing", "reasoning-effort", "openrouter", "decisions"]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
